name: Deploy to Production (GitHub Pages)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare dist folder
        run: |
          set -e
          mkdir -p dist

          # Copy and rename main HTML
          cp simple-passphrase-generator.html dist/index.html

          # Copy static assets if they exist
          for f in robots.txt sitemap.xml favicon.png og-preview.png; do
            if [ -f "$f" ]; then
              cp "$f" dist/
              echo "✔ Copied $f"
            else
              echo "⚠️  $f not found, skipping"
            fi
          done

          # Prevent Jekyll from processing
          touch dist/.nojekyll

      - name: Deploy to production branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: production
          folder: dist
          clean: true
