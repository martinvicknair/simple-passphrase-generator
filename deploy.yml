name: Deploy to production (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Prepare dist folder
        run: |
          set -e
          rm -rf dist
          mkdir -p dist

          # Copy and rename the HTML for Pages
          cp simple-password-generator.html dist/index.html

          # Copy static assets if present
          [ -f robots.txt ] && cp robots.txt dist/
          [ -f sitemap.xml ] && cp sitemap.xml dist/
          [ -f favicon.png ] && cp favicon.png dist/
          [ -f og-preview.png ] && cp og-preview.png dist/

          # Optional: ensure no Jekyll processing
          touch dist/.nojekyll

      - name: Deploy to production branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: production
          folder: dist
          clean: true
